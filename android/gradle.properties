# Ajustado para maquina de desenvolvimento comum. O template do Flutter traz
# -Xmx8G, que numa maquina de 16 GB deixa o daemon segurando memoria demais.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G

# o daemon morre depois de 30 min ocioso, em vez das 3 h padrao
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
