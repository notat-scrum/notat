name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verificacao:
    name: Análise, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # a versão vem do .fvmrc, para o CI usar exatamente o mesmo SDK que o time
      - name: Lê a versão do Flutter no .fvmrc
        id: fvmrc
        run: echo "versao=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.versao }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formatação
        run: dart format --set-exit-if-changed .

      # sem --fatal-infos o analyze sai com código 0 mesmo cheio de apontamentos
      - name: Análise estática
        run: flutter analyze --fatal-infos

      - name: Testes
        run: flutter test

      - name: Build do APK de debug
        run: flutter build apk --debug
